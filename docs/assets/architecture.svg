<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="t d"><title id="t">Unified Office Workspace: Systemarchitektur</title><desc id="d">Nuxt Webanwendung kommuniziert mit FastAPI. FastAPI greift auf PostgreSQL zu. Provider Adapter und Worker für externe Dienste sind geplant.</desc><rect width="1000" height="630" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#24344a}.title{font-size:29px;font-weight:bold}.h{font-size:21px;font-weight:bold}.sm{font-size:16px}.box{stroke:#6888aa;stroke-width:2;rx:13}.line{stroke:#406b96;stroke-width:3;fill:none;marker-end:url(#a)}.planned{stroke-dasharray:8 6}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#406b96"/></marker></defs><text class="title" x="45" y="52">Unified Office Workspace</text><text x="45" y="80" class="sm">Modularer Monolith · Hybrid Data Ownership</text><rect class="box" x="270" y="115" width="460" height="105" fill="#e6f2fc"/><text class="h" x="500" y="155" text-anchor="middle">Nuxt 4 + Vue 3 + Nuxt UI</text><text class="sm" x="500" y="188" text-anchor="middle">Dashboard · Widgets · Notes · Tasks · Bookmarks</text><path class="line" d="M500 220 V272"/><text class="sm" x="518" y="253">REST / JSON</text><rect class="box" x="220" y="275" width="560" height="100" fill="#e7eefb"/><text class="h" x="500" y="315" text-anchor="middle">FastAPI / Python</text><text class="sm" x="500" y="348" text-anchor="middle">Domain-Module · Validierung · API-Verträge</text><path class="line" d="M500 375 V445"/><rect class="box" x="295" y="445" width="410" height="90" fill="#e7f7ee"/><text class="h" x="500" y="483" text-anchor="middle">PostgreSQL</text><text class="sm" x="500" y="512" text-anchor="middle">Persistente lokale Daten und Layouts</text><rect class="box planned" x="25" y="296" width="170" height="85" fill="#f7f8fb"/><text class="h" x="110" y="328" text-anchor="middle">Worker</text><text class="sm" x="110" y="354" text-anchor="middle">geplant</text><rect class="box planned" x="805" y="296" width="170" height="85" fill="#f7f8fb"/><text class="h" x="890" y="328" text-anchor="middle">Connectors</text><text class="sm" x="890" y="354" text-anchor="middle">geplant</text><path class="line planned" d="M220 329 H197"/><path class="line planned" d="M780 329 H802"/><text class="sm" x="45" y="587">Durchgezogene Elemente: Basisarchitektur · gestrichelte Elemente: spätere Meilensteine</text></svg>